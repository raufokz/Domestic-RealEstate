name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "nextjs-frontend/**"

  workflow_dispatch:

env:
  NODE_VERSION: 20

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nextjs-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: nextjs-frontend/package-lock.json

      - name: Install Packages
        run: npm ci --legacy-peer-deps

      - name: Create Production Environment
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_SITE_URL=https://domesticrealestate.us
          NEXT_PUBLIC_API_URL=https://api.domesticrealestate.us/api
          EOF

      - name: Build
        run: npm run build

      - name: Prepare Standalone
        run: |
          cp -r .next/static .next/standalone/.next
          cp -r public .next/standalone/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p ${{ secrets.PORT }} \
          ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Upload Files
        run: |
          rsync -az --delete \
          -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.PORT }}" \
          .next/standalone/ \
          ${{ secrets.USERNAME }}@${{ secrets.HOST }}:~/domains/domesticrealestate.us/public_html/nextjs-frontend/

      - name: Restart PM2
        run: |
          ssh -i ~/.ssh/id_ed25519 \
          -p ${{ secrets.PORT }} \
          ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'

          # Non-interactive SSH sessions don't source ~/.bashrc, so PATH
          # additions from nvm (how Hostinger typically installs Node) are
          # missing and `pm2`/`node`/`npm` resolve to "command not found".
          # Source nvm explicitly (its own documented fix for CI/non-interactive use).
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          export PATH="$HOME/.npm-global/bin:$HOME/.local/bin:$PATH"

          if ! command -v pm2 >/dev/null 2>&1; then
            echo "pm2 not on PATH — installing globally"
            npm install -g pm2
          fi

          cd ~/domains/domesticrealestate.us/public_html/nextjs-frontend

          pm2 delete domestic-frontend || true

          PORT=3000 HOSTNAME=0.0.0.0 pm2 start server.js \
            --name domestic-frontend

          pm2 save

          EOF
