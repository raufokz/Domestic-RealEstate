name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "nextjs-frontend/**"
      - ".github/workflows/deploy-frontend-vercel.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs-frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # NOTE: these run from the repo root, NOT nextjs-frontend/. The Vercel
      # project's "Root Directory" setting (nextjs-frontend) already tells the
      # CLI where the app lives. Adding a working-directory cd here on top of
      # that setting double-nests the path (nextjs-frontend/nextjs-frontend)
      # and silently produces a build with no matching routes -> 404 on every
      # URL, including the raw *.vercel.app one.
      - name: Pull Vercel Environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
